name: Release

# Release pipeline:  build  →  GitHub Release  →  GitHub Pages
# Every stage needs the one before it, and the Release and Pages ship the same
# tested artifact, so the published site is always the latest released app.
#
# Runs
#   - as the second half of prepare-release.yml (workflow_call) — the normal path
#   - when a release is published in the GitHub UI (Releases → Draft a new release);
#     the app files are attached to that release and the site is redeployed
#   - manually: Actions → "Release" → Run workflow with "Use workflow from" set to
#     the tag (re-publishes its assets and redeploys it to Pages, e.g. to roll back)

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version:
        description: package.json version of the `app` artifact uploaded by the caller
        type: string
        required: true
  # Run it on the tag itself ("Use workflow from" → Tags → vX.Y.Z). No free-text ref
  # input: building an arbitrary ref here would run untrusted code in the
  # default-branch cache scope (CodeQL actions/cache-poisoning).
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    # prepare-release (workflow_call) already built and uploaded the tagged app;
    # a release event or a manual run on a tag builds the run's own commit (the tag)
    # (a called workflow sees the caller's event, so the version input tells them apart)
    if: inputs.version == '' && (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag')
    uses: ./.github/workflows/build.yml
    with:
      artifact: app

  publish:
    name: GitHub Release
    needs: build
    # after our own build, or with the caller's artifact (build skipped for workflow_call)
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.version != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      VERSION: ${{ inputs.version || needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the tag matches package.json
        run: |
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version v${VERSION}."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: dist

      - name: Create or update the GitHub Release
        run: |
          cp dist/zwo-workout-builder.html "dist/zwo-workout-builder-${TAG}.html"
          # the app ships with its PWA assets (service worker, manifest, icons)
          assets="dist/zwo-workout-builder.html dist/zwo-workout-builder-${TAG}.html dist/sw.js dist/manifest.webmanifest"
          for f in dist/*.png; do assets="$assets $f"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $assets
          else
            gh release create "$TAG" \
              --title "Zwo Workout Builder ${TAG}" \
              --generate-notes \
              --verify-tag \
              $assets
          fi

  pages:
    name: GitHub Pages
    needs: publish
    # explicit, since the skipped build job would otherwise skip this stage too
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      use-artifact: true
    permissions:
      contents: read
      pages: write
      id-token: write

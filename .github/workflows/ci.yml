name: CI

# Engine tests + app build on pushes to develop and on pull requests into develop.
# Docs-only changes are skipped; a newer push cancels the running check for the same ref.

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md']
  pull_request:
    branches: [develop]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

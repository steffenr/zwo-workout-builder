name: Prepare release

# One-click release: Actions → "Prepare release" → Run workflow (on develop) → patch / minor / major.
#
#   tag:      CI gate (engine tests), bump package.json / package-lock.json,
#             commit "chore(release): X", tag vX, build the app (artifact `app`),
#             push branch + tag atomically
#   release:  release.yml with that artifact  →  GitHub Release → GitHub Pages
#
# Everything runs in this one run with the default GITHUB_TOKEN — no PAT needed.
# (Pushes made with GITHUB_TOKEN don't start other workflows, so the tag push does
# not trigger release.yml a second time.)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and tag
    # releases are cut from develop only
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: CI gate
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          NEXT=$(node -p "require('./package.json').version")
          TAG="v${NEXT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump manually or choose a different increment."
            exit 1
          fi
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${NEXT}"
          git tag -a "$TAG" -m "Release ${NEXT}"

      # Build the tagged commit here and hand it to release.yml as the `app` artifact,
      # so the reusable build never has to check out a ref passed in as an input.
      - name: Build the tagged app
        run: |
          npm run build
          mkdir -p app-assets
          cp dist/zwo-workout-builder.html dist/sw.js dist/manifest.webmanifest app-assets/
          cp dist/*.png app-assets/

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: app-assets
          if-no-files-found: error
          retention-days: 7

      - name: Push branch and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # atomic: branch and tag land together or not at all (e.g. develop moved meanwhile)
          git push --atomic origin HEAD:refs/heads/develop "refs/tags/${TAG}"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
    permissions:
      contents: write
      pages: write
      id-token: write

name: Deploy app to GitHub Pages

# Publishes the built app (dist/zwo-workout-builder.html) as the site's index.html
# on every push to develop, or manually from Actions -> "Deploy app to GitHub Pages".
# Only the app is published: it carries the library's power structures and metrics,
# never its titles or descriptions (see build-app.mjs). The library review page
# (npm run review) is NOT deployed.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Validate the engine before shipping the app.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/zwo-workout-builder.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

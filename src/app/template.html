<title>Zwo Workout Builder</title>
<link rel="icon" type="image/svg+xml" href="__ICON_URI__">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* zwoWorkoutBuilder — follows the zwoTrainer design system (DESIGN.md):
   pure white / pure black themes, one cyan accent, five zone colours reserved for intensity. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --surface-3: #eceef2;
  --line: #e5e7eb;
  --line-strong: #cfd3da;
  --text: #1f2328;
  --text-2: #555555;
  --muted: #8a9099;
  --accent: #00a3c4;
  --accent-hover: #0090ad;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0, 163, 196, .10);
  --ok: #2e9e4f;
  --ok-soft: rgba(46, 158, 79, .12);
  --warn: #b7791f;
  --warn-soft: rgba(183, 121, 31, .12);
  --danger: #e0352b;
  --ftp: #1f2328;
  --track: #eceef2;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 24px 60px rgba(16, 24, 40, .18);
  --backdrop: rgba(15, 18, 24, .35);
  /* zone fills: identical in both themes */
  --z1: #7f7f7f; --z2: #338cff; --z3: #59bf59; --z4: #ffcc3f; --z5: #ff6639; --free: #b4bac2;
  /* zone inks: coloured text on the page background */
  --z1-ink: #6b6b6b; --z2-ink: #1f74e0; --z3-ink: #2f9a3a; --z4-ink: #b88a00; --z5-ink: #e4501f;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable Text", "Segoe UI", Roboto, "Noto Sans", Cantarell, sans-serif;
  --num: "SF Pro Rounded", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0b0b0c; --surface-2: #141416; --surface-3: #1c1c1f;
    --line: #232326; --line-strong: #34343a;
    --text: #f2f2f3; --text-2: #cccccc; --muted: #85858d;
    --accent: #1cc4e6; --accent-hover: #44d2ee; --accent-ink: #001318; --accent-soft: rgba(28, 196, 230, .14);
    --ok: #4cd07a; --ok-soft: rgba(76, 208, 122, .14); --warn: #f2c14e; --warn-soft: rgba(242, 193, 78, .12); --danger: #ff5a4f;
    --ftp: #ffffff; --track: #1c1c1f;
    --shadow: none; --shadow-lg: 0 30px 80px rgba(0, 0, 0, .8); --backdrop: rgba(0, 0, 0, .7);
    --z1-ink: #a6a6a6; --z2-ink: #5aa4ff; --z3-ink: #6fd06f; --z4-ink: #ffcc3f; --z5-ink: #ff7a52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0b0b0c; --surface-2: #141416; --surface-3: #1c1c1f;
  --line: #232326; --line-strong: #34343a;
  --text: #f2f2f3; --text-2: #cccccc; --muted: #85858d;
  --accent: #1cc4e6; --accent-hover: #44d2ee; --accent-ink: #001318; --accent-soft: rgba(28, 196, 230, .14);
  --ok: #4cd07a; --ok-soft: rgba(76, 208, 122, .14); --warn: #f2c14e; --warn-soft: rgba(242, 193, 78, .12); --danger: #ff5a4f;
  --ftp: #ffffff; --track: #1c1c1f;
  --shadow: none; --shadow-lg: 0 30px 80px rgba(0, 0, 0, .8); --backdrop: rgba(0, 0, 0, .7);
  --z1-ink: #a6a6a6; --z2-ink: #5aa4ff; --z3-ink: #6fd06f; --z4-ink: #ffcc3f; --z5-ink: #ff7a52;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 15px; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.small { font-size: 13px; }
.meta { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
code { font: 12px var(--mono); background: var(--surface-3); padding: 1px 6px; border-radius: 5px; color: var(--text-2); word-break: break-all; }
.hint { color: var(--text-2); font-size: 13.5px; max-width: 70ch; }
.warn-text { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px;
  padding: 10px max(24px, env(safe-area-inset-right, 0px)) 10px max(24px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-size: 18px; letter-spacing: -0.01em; border-radius: 8px; }
.brand b { color: var(--accent); font-weight: 700; }
.brand svg { width: 26px; height: 26px; flex: none; }
.topbar-right { display: flex; align-items: center; gap: 4px; }
.icon-btn { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { color: var(--text); background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- layout ---------- */
.view { max-width: 1120px; margin: 0 auto; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 80px max(24px, env(safe-area-inset-left, 0px)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.section { margin-top: 32px; }
.wizard { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; margin-top: 18px; }
.step { display: grid; gap: 22px; }
.q { display: grid; gap: 6px; }
.q p { color: var(--text-2); max-width: 64ch; }

/* steps: tab row, accent underline on the current step */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--muted); font: 700 11px var(--num); }
.tabs button.done { color: var(--text-2); }
.tabs button.done .n { background: var(--accent-soft); color: var(--accent); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs button.on .n { background: var(--accent); color: var(--accent-ink); }
.tabs button:disabled { cursor: default; opacity: .6; }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 16px; font: 600 14px var(--font); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.round { border-radius: 50%; width: 28px; height: 28px; padding: 0; font-size: 16px; }
.btn svg { width: 16px; height: 16px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.step-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.step-actions .why { margin-right: auto; color: var(--warn); font-size: 13.5px; }

/* ---------- choice cards (plan-card pattern) ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.choice { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; transition: border-color .15s, transform .15s; position: relative; min-width: 0; }
.choice:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.choice.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.choice.on::after { content: "✓"; position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 12px/20px var(--font); text-align: center; }
.choice h3 { padding-right: 26px; }
.choice .sub { color: var(--text-2); font-size: 13.5px; }
.choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice .art { width: 100%; height: 56px; display: block; margin-bottom: 6px; border-radius: 6px; }
.zmix { display: flex; height: 6px; border-radius: 99px; overflow: hidden; gap: 2px; margin-top: auto; padding-top: 0; }
.choice .zmix { margin-top: 8px; }
.zmix i { display: block; border-radius: 99px; }

/* ---------- form controls ---------- */
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { padding: 0; margin-bottom: 10px; }
.form { display: grid; gap: 4px; }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow > span:first-child { display: grid; gap: 2px; }
.frow > span:first-child small { font-size: 12.5px; }
.unit-in { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
input[type=number], input[type=date], select { background: var(--surface); border: 1px solid var(--line-strong); color: var(--text); border-radius: 10px; padding: 8px 12px; font: 14px var(--font); outline: none; }
input[type=number] { width: 96px; text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.range { display: flex; align-items: center; gap: 14px; flex: 1; max-width: 420px; }
.range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.range output { min-width: 5.5em; text-align: right; font: 600 15px var(--num); font-variant-numeric: tabular-nums; }
.seg-ctl { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.seg-ctl button { all: unset; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg-ctl button:hover { color: var(--text); }
.seg-ctl button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); outline: 1px solid var(--line); }
.seg-ctl button:focus-visible { outline: 2px solid var(--accent); }
.check { display: inline-flex; align-items: center; gap: 10px; color: var(--text-2); cursor: pointer; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
/* chips: zone-filter pattern; --zc is a zone fill, or the accent for non-zone choices */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.zchip { --zc: var(--accent); display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font: 500 13px var(--font); cursor: pointer; }
.zchip i { width: 9px; height: 9px; border-radius: 3px; background: var(--zc); }
.zchip:hover { border-color: var(--line-strong); }
.zchip.on { border-color: var(--zc); background: color-mix(in srgb, var(--zc) 16%, var(--surface)); color: var(--text); }

/* readouts (summary.stats pattern) */
.stats { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; }
.stats > div { display: grid; gap: 2px; min-width: 0; }
.stats b { font: 600 22px/1.15 var(--num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats b.txt { font: 600 16px/1.3 var(--font); }

/* ---------- week planner ---------- */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.day { display: grid; gap: 8px; justify-items: center; align-content: start; padding: 12px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); min-width: 0; }
.day.on { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day .dtog { all: unset; display: grid; justify-items: center; gap: 2px; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
.day .dtog b { font-size: 15px; font-weight: 650; }
.day:not(.on) .dtog b { color: var(--muted); }
.day .dtog small { font-size: 11.5px; }
.stepper { display: grid; justify-items: center; gap: 6px; width: 100%; }
.stepper output { font: 650 19px/1.1 var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.stepper .steps { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.stepper .steps button { all: unset; display: grid; place-items: center; width: 30px; height: 24px; cursor: pointer; color: var(--text); font: 600 15px/1 var(--font); transition: background .15s; }
.stepper .steps button + button { border-left: 1px solid var(--line); }
.stepper .steps button:hover:not(:disabled) { background: var(--surface-3); }
.stepper .steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 999px; }
.stepper .steps button:disabled { opacity: .35; cursor: not-allowed; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.badge.muted { background: var(--surface-3); color: var(--muted); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.outtog { all: unset; cursor: pointer; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface-3); color: var(--muted); }
.outtog[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.pbar { height: 6px; background: var(--track); border-radius: 99px; overflow: visible; position: relative; }
.pbar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.pbar u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); border-radius: 1px; }

/* ---------- summary sidebar ---------- */
.side { position: sticky; top: 76px; display: grid; gap: 16px; }
.side .stats { --cols: 2; gap: 14px 12px; }
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekstrip span { height: 24px; border-radius: 6px; display: grid; place-items: center; font: 600 11px var(--font); background: var(--surface-2); color: var(--muted); }
.weekstrip span.on { background: var(--accent-soft); color: var(--accent); }
.weekstrip span.out { background: var(--surface-3); color: var(--text-2); }

/* ---------- results ---------- */
.plan-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.wk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 8px; }
.wk-head h3 { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; display: flex; gap: 10px; align-items: center; }
.wk-head .meta { margin: 0; font-variant-numeric: tabular-nums; }
.wlist { display: flex; flex-direction: column; gap: 6px; }
.wrow { display: grid; grid-template-columns: 44px minmax(160px, 1fr) 200px 64px 92px; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 9px 14px; cursor: pointer; transition: border-color .15s; }
.wrow:hover, .wrow:focus-visible { border-color: var(--line-strong); outline: none; }
.wrow.open { border-color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), var(--surface) 60%); }
.wrow.outdoor { cursor: default; background: var(--surface-2); }
.wrow.outdoor:hover { border-color: var(--line); }
.wd { justify-self: start; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; letter-spacing: .03em; }
.wrow.outdoor .wd { color: var(--muted); background: var(--surface-3); }
.wt { display: flex; flex-direction: column; min-width: 0; font-weight: 550; }
.wt span, .wt small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.wprof .mini { width: 200px; height: 28px; display: block; }
.wdur { color: var(--muted); font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.wtss { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.wtss small { color: var(--muted); font-size: 11px; }
.ztag { display: inline-grid; place-items: center; min-width: 26px; height: 18px; padding: 0 5px; border-radius: 5px; font-size: 11px; font-weight: 650; color: #000; background: var(--zc); }
.mini { display: block; width: 100%; }

/* weekly load chart: accent = build, soft accent = recovery, muted = taper; never zone colours */
.load { display: grid; gap: 8px; }
.lbars { display: flex; gap: 6px; align-items: flex-end; height: 120px; padding-top: 16px; }
.lbar { flex: 1; height: 100%; position: relative; min-width: 0; }
.lbar .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 5px 5px 2px 2px; background: var(--accent); }
.lbar.recovery .fill { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.lbar.taper .fill { background: var(--line-strong); }
.lbar .tgt { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--text); opacity: .5; }
.lbar .val { position: absolute; left: 0; right: 0; text-align: center; font: 600 11px var(--num); color: var(--muted); padding-bottom: 3px; font-variant-numeric: tabular-nums; }
.lweeks { display: flex; gap: 6px; }
.lweeks span { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.lweeks span b { display: block; color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.legend i.tgt { height: 2px; width: 12px; background: var(--text); opacity: .5; border-radius: 1px; }

.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.opt { display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color .15s, transform .15s; }
.opt:hover, .opt:focus-visible { border-color: var(--line-strong); transform: translateY(-1px); outline: none; }
.opt .mini { height: 64px; background: var(--surface-2); border-radius: 10px; }
.opt .actions { justify-content: flex-start; margin-top: auto; }

/* ---------- dialog (preview) ---------- */
dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(3px); }
.modal-body { padding: 24px; display: grid; gap: 16px; }
.pv-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.pv-head h2 { margin-top: 4px; }
.pv-diagram { background: var(--surface-2); border-radius: 12px; padding: 12px 12px 8px 56px; position: relative; }
.pv-diagram .big { width: 100%; height: 200px; display: block; }
.axis { position: absolute; left: 8px; top: 12px; bottom: 8px; width: 44px; }
.tick { position: absolute; right: 0; transform: translateY(50%); font: 11px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; }
.seg-click { cursor: pointer; transition: opacity .15s; }
.seg-click:hover { opacity: .8; }
.seg-info { min-height: 22px; font-size: 13.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.seg-info b { color: var(--text); }
.zones-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; }
.zones-bar i { display: block; }
.zones-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.zones-legend span { display: inline-flex; align-items: center; gap: 6px; }
.zones-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.zones-legend b { color: var(--text); font-weight: 600; }
.pv-desc { color: var(--text-2); font-size: 14px; user-select: text; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.modal-actions .left { margin-right: auto; }

/* ---------- popover ---------- */
.popover { position: fixed; z-index: 200; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; min-width: 260px; }
.pop-title { padding: 6px 10px 4px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pop-row { padding: 6px 10px 10px; }
.popover hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.popover p { padding: 4px 10px 8px; font-size: 12.5px; color: var(--muted); }

.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; z-index: 100; box-shadow: var(--shadow-lg); font-weight: 550; max-width: calc(100vw - 32px); }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 32px; }
.foot a { color: var(--text-2); text-decoration: underline; text-underline-offset: 2px; }
